name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces an unfinished scan.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh

      # Pull requests that don't touch anything CodeQL analyses skip the scan
      # (the check still reports success). Main and the weekly run always scan.
      - name: Check for code changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='\.swift$|^Packages/|^Plainfile\.xcodeproj/|^Config/|^\.github/workflows/codeql\.yml$'
          if git diff --name-only "$BASE...$HEAD" | grep -qE "$pattern"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "No code changes in this pull request; CodeQL scan skipped."
          fi

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.changes.outputs.scan != 'false'
        with:
          languages: swift
          build-mode: manual

      # CodeQL reads the source, so an unoptimised, unsigned debug build gives
      # the same results as a release build and compiles far faster.
      - name: Build (debug, for analysis)
        if: steps.changes.outputs.scan != 'false'
        run: |
          xcodebuild build \
            -project Plainfile.xcodeproj \
            -scheme Plainfile \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/CodeQL \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.changes.outputs.scan != 'false'
        with:
          category: "/language:swift"
